name: skill-sync-check

# Fails if the Claude Code plugin mirror has drifted from the canonical skill
# files at the repo root. Run `bash sync.sh` locally to fix.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sync-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify plugin mirror is in sync with root
        run: bash sync.sh --check
